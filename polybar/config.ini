;╔═══════════════════════════════════════════════════════════════════╗
;║         POLYBAR — CYBERPUNK NEON  ×  FULL FEATURED               ║
;║         Designed for i3 / bspwm / Hyprland                       ║
;╚═══════════════════════════════════════════════════════════════════╝


;══════════════════════════════════════════════
; COLORS
;══════════════════════════════════════════════

[colors]
bg              = #cc060d10
bg-alt          = #0d1b1e
fg              = #c8fce8
fg-dim          = #4a7a6a
transparent     = #00000000

neon-green      = #00ff9c
neon-cyan       = #00e5ff
neon-blue       = #00b4ff
neon-magenta    = #d45aff
neon-yellow     = #f7c948
neon-red        = #ff3b5c
neon-orange     = #ff8c42

alert           = #ff3b5c
warning         = #f7c948
ok              = #00ff9c
muted           = #1a3a40
sep             = #1a3a40

;══════════════════════════════════════════════
; BAR — MAIN TOP
;══════════════════════════════════════════════

[bar/main]
monitor             = ${env:MONITOR:}
width               = 100%
height              = 32
offset-x            = 0
offset-y            = 0
radius              = 0

bottom              = false
fixed-center        = true
override-redirect   = false

background          = ${colors.bg}
foreground          = ${colors.fg}

border-bottom-size  = 0
border-bottom-color = ${colors.neon-green}
border-top-size     = 0

padding-left        = 2
padding-right       = 2
module-margin       = 1

font-0              = JetBrainsMono Nerd Font:style=Bold:size=9;2
font-1              = JetBrainsMono Nerd Font:style=Regular:size=9;2
font-2              = JetBrainsMono Nerd Font:style=Regular:size=14;4
font-3              = JetBrainsMono Nerd Font:style=Bold:size=7;2

modules-left        = powermenu sep xworkspaces sep xwindow
modules-center      = datetime
modules-right = spotify sep cpu memory sep temperature sep powerprofile sep battery sep pulseaudio sep bluetooth sep wifi
scroll-up           = i3-msg workspace next_on_output
scroll-down         = i3-msg workspace prev_on_output

enable-ipc          = true


;══════════════════════════════════════════════
; SEPARATOR
;══════════════════════════════════════════════

[module/sep]
type                = custom/text
format              = <label>
label               = " │ "
label-foreground    = ${colors.sep}


;══════════════════════════════════════════════
; WORKSPACES
;══════════════════════════════════════════════

[module/xworkspaces]
type                        = internal/xworkspaces
pin-workspaces              = true
show-urgent                 = true
icon-default                = 󰊠

label-active                = %icon% %name%
label-active-foreground     = ${colors.neon-green}
label-active-background     = #1a2a1e
label-active-underline      = ${colors.neon-green}
label-active-padding        = 2

label-occupied              = %icon% %name%
label-occupied-foreground   = ${colors.fg-dim}
label-occupied-underline    = ${colors.muted}
label-occupied-padding      = 2

label-urgent                = %icon% %name%
label-urgent-foreground     = ${colors.neon-red}
label-urgent-underline      = ${colors.neon-red}
label-urgent-background     = #2a0d10
label-urgent-padding        = 2

label-empty                 = %icon%
label-empty-foreground      = #1a3a40
label-empty-padding         = 2

icon-0                      = 1;󰖟
icon-1                      = 2;󰖟
icon-2                      = 3;󰨞
icon-3                      = 4;󰉋
icon-4                      = 5;󰙯
icon-5                      = 6;󰎆
icon-6                      = 7;󰈙
icon-7                      = 8;󰒓
icon-8                      = 9;󰆍


;══════════════════════════════════════════════
; ACTIVE WINDOW TITLE
;══════════════════════════════════════════════

[module/xwindow]
type                        = internal/xwindow
label                       = %title:0:40:…%
label-foreground            = ${colors.fg-dim}
label-empty                 = 󰇄 Desktop
label-empty-foreground      = ${colors.muted}


;══════════════════════════════════════════════
; DATETIME — ANIMATED BLINKING COLON
;══════════════════════════════════════════════

[module/datetime]
type                = custom/script
exec                = ~/.config/polybar/scripts/datetime.sh
interval            = 1
format-padding      = 0
format-background   = ${colors.bg}
format-underline    = ${colors.neon-cyan}
label               = %output%
label-foreground    = ${colors.neon-cyan}


;══════════════════════════════════════════════
; SPOTIFY
;══════════════════════════════════════════════

[module/spotify]
type                     = custom/ipc
hook-0                   = ~/.config/polybar/scripts/spotify.sh
initial                  = 1
format-prefix            = "󰓇 "
format-prefix-foreground = #1db954
format-underline         = #1db954
label-foreground         = ${colors.fg}
click-left               = playerctl play-pause
click-right              = playerctl next
scroll-up                = playerctl next
scroll-down              = playerctl previous

;══════════════════════════════════════════════
; CPU
;══════════════════════════════════════════════

[module/cpu]
type                        = internal/cpu
interval                    = 1
format-prefix               = "󰻠 "
format-prefix-foreground    = ${colors.neon-blue}
format-underline            = ${colors.neon-blue}
label                       = %percentage%%

ramp-coreload-spacing       = 1
ramp-coreload-0             = ▁
ramp-coreload-1             = ▂
ramp-coreload-2             = ▃
ramp-coreload-3             = ▄
ramp-coreload-4             = ▅
ramp-coreload-5             = ▆
ramp-coreload-6             = ▇
ramp-coreload-7             = █
ramp-coreload-0-foreground  = ${colors.ok}
ramp-coreload-1-foreground  = ${colors.ok}
ramp-coreload-2-foreground  = ${colors.ok}
ramp-coreload-3-foreground  = ${colors.neon-yellow}
ramp-coreload-4-foreground  = ${colors.neon-yellow}
ramp-coreload-5-foreground  = ${colors.warning}
ramp-coreload-6-foreground  = ${colors.alert}
ramp-coreload-7-foreground  = ${colors.alert}


;══════════════════════════════════════════════
; MEMORY
;══════════════════════════════════════════════

[module/memory]
type                        = internal/memory
interval                    = 1
format-prefix               = "󰍛 "
format-prefix-foreground    = ${colors.neon-magenta}
format-underline            = ${colors.neon-magenta}
label                       = %percentage_used%%

bar-used-indicator          =
bar-used-width              = 8
bar-used-foreground-0       = ${colors.ok}
bar-used-foreground-1       = ${colors.ok}
bar-used-foreground-2       = ${colors.neon-yellow}
bar-used-foreground-3       = ${colors.alert}
bar-used-fill               = ━
bar-used-empty              = ─
bar-used-empty-foreground   = ${colors.muted}


;══════════════════════════════════════════════
; TEMPERATURE
;══════════════════════════════════════════════

[module/temperature]
type                        = internal/temperature
interval                    = 1
thermal-zone                = 1
hwmon-path                  = ${env:HWMON_PATH:/sys/class/hwmon/hwmon6/temp1_input}
base-temperature            = 40
warn-temperature            = 80
units                       = true

format                      = <ramp> <label>
format-underline            = ${colors.neon-orange}
format-warn                 = <ramp> <label-warn>
format-warn-underline       = ${colors.alert}

label                       = %temperature-c%°
label-warn                  = %temperature-c%°
label-warn-foreground       = ${colors.alert}

ramp-0                      = 󱃃
ramp-1                      = 󰔏
ramp-2                      = 󰸁
ramp-0-foreground           = ${colors.ok}
ramp-1-foreground           = ${colors.neon-yellow}
ramp-2-foreground           = ${colors.alert}

;══════════════════════════════════════════════
; PULSEAUDIO / VOLUME
;══════════════════════════════════════════════

[module/pulseaudio]
type                        = internal/pulseaudio
use-ui-max                  = true
interval                    = 2

format-volume               = <ramp-volume> <label-volume>
format-volume-underline     = ${colors.neon-cyan}
label-volume                = %percentage%%

format-muted                = <label-muted>
format-muted-foreground     = ${colors.muted}
label-muted                 = 󰝟 muted

ramp-volume-0               = 󰕿
ramp-volume-1               = 󰖀
ramp-volume-2               = 󰕾
ramp-volume-0-foreground    = ${colors.fg-dim}
ramp-volume-1-foreground    = ${colors.neon-cyan}
ramp-volume-2-foreground    = ${colors.neon-cyan}

click-right                 = pavucontrol &
click-left                  = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up                   = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
scroll-down                 = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-


;══════════════════════════════════════════════
; POWER PROFILE
;══════════════════════════════════════════════

[module/powerprofile]
type                        = custom/script
exec                        = ~/.config/polybar/scripts/powerprofile.sh
interval                    = 2
format-underline            = ${colors.neon-green}
label                       = %output%
label-foreground            = ${colors.fg}
click-left                  = ~/.config/polybar/scripts/powerprofile-toggle.sh &
click-right                 = gnome-control-center power &


;══════════════════════════════════════════════
; BLUETOOTH
;══════════════════════════════════════════════

[module/bluetooth]
type                        = custom/script
exec                        = ~/.config/polybar/scripts/bluetooth.sh
interval                    = 2
format-underline            = ${colors.neon-magenta}
label                       = %output%
label-foreground            = ${colors.neon-magenta}
click-left                  = blueman-manager &
click-right                 = blueman-manager &


;══════════════════════════════════════════════
; WIFI
;══════════════════════════════════════════════

[module/wifi]
type                        = custom/script
exec                        = ~/.config/polybar/scripts/wifi.sh
interval                    = 2
format-underline            = ${colors.neon-blue}
label                       = %output%
label-foreground            = ${colors.neon-blue}
click-left                  = nm-connection-editor &
click-right                 = nm-connection-editor &
;══════════════════════════════════════════════
; POWERMENU
;══════════════════════════════════════════════

[module/powermenu]
type                = custom/menu
expand-right        = true
format-spacing      = 1

label-open          = 󰐥
label-open-foreground = ${colors.neon-red}
label-close         = 󰅖 cancel
label-close-foreground = ${colors.fg-dim}
label-separator     = " | "
label-separator-foreground = ${colors.sep}

menu-0-0            = 󰜉 reboot
menu-0-0-exec       = systemctl reboot
menu-0-0-foreground = ${colors.neon-yellow}
menu-0-1            = 󰐥 poweroff
menu-0-1-exec       = systemctl poweroff
menu-0-1-foreground = ${colors.neon-red}
menu-0-2            = 󰌾 lock
menu-0-2-exec       = ~/.config/polybar/scripts/lock.sh
menu-0-2-foreground = ${colors.neon-blue}
menu-0-3            = 󰍃 logout
menu-0-3-exec       = i3-msg exit
menu-0-3-foreground = ${colors.neon-orange}


[module/brightness]
type             = custom/script
exec             = brightnessctl -d nvidia_wmi_ec_backlight get | awk -v max=$(brightnessctl -d nvidia_wmi_ec_backlight max) '{printf "%d%%", ($1/max)*100}'
interval         = 1
format-prefix    = "󰃠 "
format-prefix-foreground = ${colors.neon-yellow}
scroll-up        = brightnessctl -d nvidia_wmi_ec_backlight set 5%+
scroll-down      = brightnessctl -d nvidia_wmi_ec_backlight set 5%-


;══════════════════════════════════════════════
; BATTERY
;══════════════════════════════════════════════

[module/battery]
type                        = internal/battery
; Run: ls /sys/class/power_supply/ — use your actual names
battery                     = BAT1
adapter                     = ACAD
full-at                     = 98
poll-interval               = 5

format-charging             = <animation-charging> <label-charging>
format-charging-underline   = ${colors.neon-green}

format-discharging          = <ramp-capacity> <label-discharging>
format-discharging-underline = ${colors.neon-yellow}

format-full                 = <label-full>
format-full-prefix          = "󰁹 "
format-full-prefix-foreground = ${colors.neon-green}
format-full-underline       = ${colors.neon-green}

label-charging              = %percentage%%
label-discharging           = %percentage%% (%time%)
label-full                  = Full
label-full-foreground       = ${colors.neon-green}

ramp-capacity-0             = 󰁺
ramp-capacity-1             = 󰁻
ramp-capacity-2             = 󰁼
ramp-capacity-3             = 󰁽
ramp-capacity-4             = 󰁾
ramp-capacity-5             = 󰁿
ramp-capacity-6             = 󰂀
ramp-capacity-7             = 󰂁
ramp-capacity-8             = 󰂂
ramp-capacity-9             = 󰁹
ramp-capacity-0-foreground  = ${colors.alert}
ramp-capacity-1-foreground  = ${colors.alert}
ramp-capacity-2-foreground  = ${colors.warning}
ramp-capacity-3-foreground  = ${colors.warning}
ramp-capacity-4-foreground  = ${colors.neon-yellow}
ramp-capacity-5-foreground  = ${colors.neon-yellow}
ramp-capacity-6-foreground  = ${colors.ok}
ramp-capacity-7-foreground  = ${colors.ok}
ramp-capacity-8-foreground  = ${colors.neon-green}
ramp-capacity-9-foreground  = ${colors.neon-green}

animation-charging-0        = 󰁺
animation-charging-1        = 󰁼
animation-charging-2        = 󰁾
animation-charging-3        = 󰂀
animation-charging-4        = 󰂂
animation-charging-framerate = 750
animation-charging-foreground = ${colors.neon-green}


;══════════════════════════════════════════════
; KEYBOARD / LANGUAGE
;══════════════════════════════════════════════

[module/xkeyboard]
type                        = internal/xkeyboard
blacklist-0                 = num lock
blacklist-1                 = scroll lock
blacklist-2                 = caps lock

; Suppress layout switching menu — shows current layout only
format                      = <label-layout>
format-prefix               = "󰌌 "
format-prefix-foreground    = ${colors.neon-cyan}
format-underline            = ${colors.neon-cyan}

label-layout                = %layout%
label-layout-foreground     = ${colors.fg}

; Click to cycle layouts (only useful if you have >1 layout)
click-left                  = setxkbmap us && pkill -RTMIN+1 polybar
