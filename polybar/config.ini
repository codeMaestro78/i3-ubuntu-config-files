;╔═══════════════════════════════════════════════════════════════════╗
;║         POLYBAR — CYBERPUNK NEON  ×  FULL FEATURED               ║
;║         Designed for i3 / bspwm / Hyprland                       ║
;╚═══════════════════════════════════════════════════════════════════╝


;══════════════════════════════════════════════
; COLORS
;══════════════════════════════════════════════

[colors]
bg              = #aa1e1e2e
bg-alt          = #313244
fg              = #cdd6f4
fg-dim          = #6c7086
transparent     = #00000000

; ── Catppuccin Mocha palette ─────────────────────────────────
blue            = #89b4fa
lavender        = #b4befe
sapphire        = #74c7ec
sky             = #89dceb
teal            = #94e2d5
green           = #a6e3a1
yellow          = #f9e2af
peach           = #fab387
maroon          = #eba0ac
red             = #f38ba8
mauve           = #cba6f7
pink            = #f5c2e7
flamingo        = #f2cdcd
rosewater       = #f5e0dc

; ── Semantic aliases ──────────────────────────────────────────
alert           = #f38ba8
warning         = #f9e2af
ok              = #a6e3a1
muted           = #45475a
sep             = #45475a

;══════════════════════════════════════════════
; BAR — MAIN TOP
;══════════════════════════════════════════════

[bar/main]
monitor             = ${env:MONITOR:}
width               = 97%
height              = 32
offset-x            = 1.5%
offset-y            = 6
radius              = 12

bottom              = false
fixed-center        = true
override-redirect   = true
wm-restack          = i3

background          = ${colors.bg}
foreground          = ${colors.fg}

border-size         = 0

padding-left        = 2
padding-right       = 2
module-margin       = 1

font-0              = JetBrainsMono Nerd Font:style=Bold:size=9;2
font-1              = JetBrainsMono Nerd Font:style=Regular:size=9;2
font-2              = JetBrainsMono Nerd Font:style=Regular:size=14;4
font-3              = JetBrainsMono Nerd Font:style=Bold:size=7;2

modules-left        = powermenu sep xworkspaces sep xwindow
modules-center      = datetime
modules-right = spotify sep cpu memory sep temperature sep powerprofile sep battery sep pulseaudio sep bluetooth sep wifi
scroll-up           = i3-msg workspace next_on_output
scroll-down         = i3-msg workspace prev_on_output

enable-ipc          = true


;══════════════════════════════════════════════
; SEPARATOR
;══════════════════════════════════════════════

[module/sep]
type                = custom/text
format              = <label>
label               = " │ "
label-foreground    = ${colors.sep}


;══════════════════════════════════════════════
; WORKSPACES
;══════════════════════════════════════════════

[module/xworkspaces]
type                        = internal/xworkspaces
pin-workspaces              = true
show-urgent                 = true
icon-default                = 󰊠

label-active                = %name%
label-active-foreground     = ${colors.mauve}
label-active-background     = #2a273f
label-active-underline      = ${colors.mauve}
label-active-padding        = 2

label-occupied              = %name%
label-occupied-foreground   = ${colors.fg-dim}
label-occupied-underline    = ${colors.muted}
label-occupied-padding      = 2

label-urgent                = %name%
label-urgent-foreground     = ${colors.red}
label-urgent-underline      = ${colors.red}
label-urgent-background     = #3a1a2a
label-urgent-padding        = 2

label-empty                 = %name%
label-empty-foreground      = ${colors.muted}
label-empty-padding         = 2


;══════════════════════════════════════════════
; ACTIVE WINDOW TITLE
;══════════════════════════════════════════════

[module/xwindow]
type                        = internal/xwindow
label                       = %title:0:40:…%
label-foreground            = ${colors.lavender}
label-empty                 = 󰇄 Desktop
label-empty-foreground      = ${colors.muted}


;══════════════════════════════════════════════
; DATETIME — ANIMATED BLINKING COLON
;══════════════════════════════════════════════

[module/datetime]
type                = custom/script
exec                = ~/.config/polybar/scripts/datetime.sh
interval            = 1
format-padding      = 0
format-background   = ${colors.bg}
format-underline    = ${colors.pink}
label               = %output%
label-foreground    = ${colors.pink}


;══════════════════════════════════════════════
; SPOTIFY
;══════════════════════════════════════════════

[module/spotify]
type                     = custom/ipc
hook-0                   = ~/.config/polybar/scripts/spotify.sh
initial                  = 1
format-prefix            = "󰓇 "
format-prefix-foreground = ${colors.green}
format-underline         = ${colors.green}
label-foreground         = ${colors.fg}
click-left               = playerctl play-pause
click-right              = playerctl next
scroll-up                = playerctl next
scroll-down              = playerctl previous

;══════════════════════════════════════════════
; CPU
;══════════════════════════════════════════════

[module/cpu]
type                        = internal/cpu
interval                    = 1
format-prefix               = "󰻠 "
format-prefix-foreground    = ${colors.blue}
format-underline            = ${colors.blue}
label                       = %percentage%%

ramp-coreload-spacing       = 1
ramp-coreload-0             = ▁
ramp-coreload-1             = ▂
ramp-coreload-2             = ▃
ramp-coreload-3             = ▄
ramp-coreload-4             = ▅
ramp-coreload-5             = ▆
ramp-coreload-6             = ▇
ramp-coreload-7             = █
ramp-coreload-0-foreground  = ${colors.teal}
ramp-coreload-1-foreground  = ${colors.teal}
ramp-coreload-2-foreground  = ${colors.green}
ramp-coreload-3-foreground  = ${colors.yellow}
ramp-coreload-4-foreground  = ${colors.yellow}
ramp-coreload-5-foreground  = ${colors.peach}
ramp-coreload-6-foreground  = ${colors.maroon}
ramp-coreload-7-foreground  = ${colors.red}


;══════════════════════════════════════════════
; MEMORY
;══════════════════════════════════════════════

[module/memory]
type                        = internal/memory
interval                    = 1
format-prefix               = "󰍛 "
format-prefix-foreground    = ${colors.mauve}
format-underline            = ${colors.mauve}
label                       = %percentage_used%%

bar-used-indicator          =
bar-used-width              = 8
bar-used-foreground-0       = ${colors.teal}
bar-used-foreground-1       = ${colors.green}
bar-used-foreground-2       = ${colors.yellow}
bar-used-foreground-3       = ${colors.red}
bar-used-fill               = ━
bar-used-empty              = ─
bar-used-empty-foreground   = ${colors.muted}


;══════════════════════════════════════════════
; TEMPERATURE
;══════════════════════════════════════════════

[module/temperature]
type                        = internal/temperature
interval                    = 1
thermal-zone                = 1
hwmon-path                  = ${env:HWMON_PATH:/sys/class/hwmon/hwmon6/temp1_input}
base-temperature            = 40
warn-temperature            = 80
units                       = true

format                      = <ramp> <label>
format-underline            = ${colors.peach}
format-warn                 = <ramp> <label-warn>
format-warn-underline       = ${colors.red}

label                       = %temperature-c%°
label-warn                  = %temperature-c%°
label-warn-foreground       = ${colors.red}

ramp-0                      = 󱃃
ramp-1                      = 󰔏
ramp-2                      = 󰸁
ramp-0-foreground           = ${colors.teal}
ramp-1-foreground           = ${colors.yellow}
ramp-2-foreground           = ${colors.red}

;══════════════════════════════════════════════
; PULSEAUDIO / VOLUME
;══════════════════════════════════════════════

[module/pulseaudio]
type                        = internal/pulseaudio
use-ui-max                  = true
interval                    = 2

format-volume               = <ramp-volume> <label-volume>
format-volume-underline     = ${colors.sky}
label-volume                = %percentage%%

format-muted                = <label-muted>
format-muted-foreground     = ${colors.muted}
label-muted                 = 󰝟 muted

ramp-volume-0               = 󰕿
ramp-volume-1               = 󰖀
ramp-volume-2               = 󰕾
ramp-volume-0-foreground    = ${colors.fg-dim}
ramp-volume-1-foreground    = ${colors.sapphire}
ramp-volume-2-foreground    = ${colors.sky}

click-right                 = pavucontrol &
click-left                  = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up                   = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
scroll-down                 = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-


;══════════════════════════════════════════════
; POWER PROFILE
;══════════════════════════════════════════════

[module/powerprofile]
type                        = custom/script
exec                        = ~/.config/polybar/scripts/powerprofile.sh
interval                    = 2
format-underline            = ${colors.green}
label                       = %output%
label-foreground            = ${colors.fg}
click-left                  = ~/.config/polybar/scripts/powerprofile-toggle.sh &
click-right                 = gnome-control-center power &


;══════════════════════════════════════════════
; BLUETOOTH
;══════════════════════════════════════════════

[module/bluetooth]
type                        = custom/script
exec                        = ~/.config/polybar/scripts/bluetooth.sh
interval                    = 2
format-underline            = ${colors.lavender}
label                       = %output%
label-foreground            = ${colors.lavender}
click-left                  = blueman-manager &
click-right                 = blueman-manager &


;══════════════════════════════════════════════
; WIFI
;══════════════════════════════════════════════

[module/wifi]
type                        = custom/script
exec                        = ~/.config/polybar/scripts/wifi.sh
interval                    = 2
format-underline            = ${colors.teal}
label                       = %output%
label-foreground            = ${colors.teal}
click-left                  = nm-connection-editor &
click-right                 = nm-connection-editor &
;══════════════════════════════════════════════
; POWERMENU
;══════════════════════════════════════════════

[module/powermenu]
type                = custom/menu
expand-right        = true
format-spacing      = 1

label-open          = 󰐥
label-open-foreground = ${colors.red}
label-close         = 󰅖 cancel
label-close-foreground = ${colors.fg-dim}
label-separator     = " | "
label-separator-foreground = ${colors.sep}

menu-0-0            = 󰜉 reboot
menu-0-0-exec       = ~/.config/polybar/scripts/power-confirm.sh reboot
menu-0-0-foreground = ${colors.yellow}
menu-0-1            = 󰐥 poweroff
menu-0-1-exec       = ~/.config/polybar/scripts/power-confirm.sh poweroff
menu-0-1-foreground = ${colors.red}
menu-0-2            = 󰌾 lock
menu-0-2-exec       = ~/.config/polybar/scripts/lock.sh
menu-0-2-foreground = ${colors.blue}
menu-0-3            = 󰍃 logout
menu-0-3-exec       = ~/.config/polybar/scripts/power-confirm.sh logout
menu-0-3-foreground = ${colors.peach}


[module/brightness]
type             = custom/script
exec             = brightnessctl -d nvidia_wmi_ec_backlight get | awk -v max=$(brightnessctl -d nvidia_wmi_ec_backlight max) '{printf "%d%%", ($1/max)*100}'
interval         = 1
format-prefix    = "󰃠 "
format-prefix-foreground = ${colors.yellow}
scroll-up        = brightnessctl -d nvidia_wmi_ec_backlight set 5%+
scroll-down      = brightnessctl -d nvidia_wmi_ec_backlight set 5%-


;══════════════════════════════════════════════
; BATTERY
;══════════════════════════════════════════════

[module/battery]
type                        = custom/script
exec                        = ~/.config/polybar/scripts/battery.sh
interval                    = 1
format                      = <label>
format-underline            = ${colors.green}
label                       = %output%
click-right                 = gnome-power-statistics &


;══════════════════════════════════════════════
; KEYBOARD / LANGUAGE
;══════════════════════════════════════════════

[module/xkeyboard]
type                        = internal/xkeyboard
blacklist-0                 = num lock
blacklist-1                 = scroll lock
blacklist-2                 = caps lock

; Suppress layout switching menu — shows current layout only
format                      = <label-layout>
format-prefix               = "󰌌 "
format-prefix-foreground    = ${colors.neon-cyan}
format-underline            = ${colors.neon-cyan}

label-layout                = %layout%
label-layout-foreground     = ${colors.fg}

; Click to cycle layouts (only useful if you have >1 layout)
click-left                  = setxkbmap us && pkill -RTMIN+1 polybar
