# ╔══════════════════════════════════════════════════════════════════════╗
# ║         PICOM — GLASSMORPHISM × NEON × SPRING PHYSICS v3            ║
# ║         Per-Class Animations × Dual-Kawase Glass Blur               ║
# ║         Neon Colored Shadows × Inner Glow Borders                   ║
# ║         Fork Required: picom-pijulius-git                           ║
# ╚══════════════════════════════════════════════════════════════════════╝


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# BACKEND
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

backend               = "glx";
glx-copy-from-front   = false;
use-damage            = false;
vsync                 = true;
xrender-sync-fence    = true;
unredir-if-possible   = false;
no-use-damage         = true;
crop-shadow-to-monitor = true;
detect-client-leader  = true;


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ROUNDED CORNERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

corner-radius = 20;

corner-radius-rules = [
  "0:class_g   = 'polybar'",
  "0:class_g   = 'i3bar'",
  "22:class_g  = 'Alacritty'",
  "20:class_g  = 'kitty'",
  "20:class_g  = 'Code'",
  "18:class_g  = 'firefox'",
  "18:class_g  = 'Brave-browser'",
  "18:class_g  = 'Chromium'",
  "22:class_g  = 'Rofi'",
  "20:class_g  = 'dunst'",
  "14:class_g  = 'Thunar'",
  "14:class_g  = 'Pavucontrol'",
  "14:class_g  = 'Blueman-manager'",
  "12:window_type = 'dialog'",
  "12:window_type = 'popup_menu'",
  "12:window_type = 'dropdown_menu'"
];

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "class_g     = 'i3bar'",
  "class_g     = 'dmenu'",
  "class_g     = 'polybar'",
  "class_g     = 'slop'",
  "class_g     = 'flameshot'",
  "fullscreen"
];


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SHADOWS — neon glow, per-context color tinting
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

shadow              = true;
shadow-radius       = 64;
shadow-opacity      = 0.70;
shadow-offset-x     = -28;
shadow-offset-y     = -28;
shadow-color        = "#06020f";       # deeper neon-tinted ambient shadow

shadow-exclude = [
  "name        = 'Notification'",
  "class_g     = 'Conky'",
  "class_g     = 'i3bar'",
  "class_g     = 'dmenu'",
  "class_g     = 'polybar'",
  "class_g     = 'slop'",
  "class_g     = 'flameshot'",
  "class_g     = 'zoom'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "window_type = 'menu'",
  "_GTK_FRAME_EXTENTS@",
  "_NET_WM_STATE[*] *= '_NET_WM_STATE_HIDDEN'"
];

clip-shadow-above = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'polybar'",
  "class_g = 'i3bar'"
];


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# FADING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

fading                    = true;
fade-in-step              = 0.008;
fade-out-step             = 0.014;
fade-delta                = 4;
no-fading-openclose       = false;
no-fading-destroyed-argb  = true;

fade-exclude = [
  "class_g = 'slop'",
  "class_g = 'polybar'",
  "class_g = 'flameshot'",
  "class_g = 'kitty'",
  "class_g = 'Alacritty'"
];


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GLASS TRANSPARENCY & OPACITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

inactive-opacity          = 0.82;
active-opacity            = 0.97;
frame-opacity             = 0.94;
inactive-opacity-override = false;
inactive-dim              = 0.18;
inactive-dim-fixed        = false;

# Glass rim — inner glow border on all windows
frame-opacity-for-same-colors-tolerance  = 0.28;
frame-opacity-for-same-colors-multiplier = 14;
inner-border-width        = 2;
inner-border-brightness   = 0.68;

opacity-rule = [
  # ── Always full opacity ───────────────────────────────────────────────
  "100:class_g = 'firefox'",
  "100:class_g = 'chromium'",
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'mpv'",
  "100:class_g = 'vlc'",
  "100:class_g = 'Gimp'",
  "100:class_g = 'obs'",
  "100:class_g = 'Steam'",
  "100:class_g = 'Spotify'",
  "100:class_g = 'feh'",
  "100:fullscreen",

  # ── Glass terminals ───────────────────────────────────────────────────
  "90:class_g  = 'Alacritty'   && focused",
  "78:class_g  = 'Alacritty'   && !focused",
  "90:class_g  = 'kitty'       && focused",
  "78:class_g  = 'kitty'       && !focused",
  "90:class_g  = 'URxvt'       && focused",
  "78:class_g  = 'URxvt'       && !focused",

  # ── Editors / IDE ─────────────────────────────────────────────────────
  "95:class_g  = 'Code'        && focused",
  "85:class_g  = 'Code'        && !focused",
  "95:class_g  = 'jetbrains-idea' && focused",
  "85:class_g  = 'jetbrains-idea' && !focused",

  # ── Communication ─────────────────────────────────────────────────────
  "94:class_g  = 'discord'          && focused",
  "80:class_g  = 'discord'          && !focused",
  "94:class_g  = 'TelegramDesktop'  && focused",
  "80:class_g  = 'TelegramDesktop'  && !focused",
  "94:class_g  = 'Slack'            && focused",
  "80:class_g  = 'Slack'            && !focused",

  # ── Launchers / overlays ──────────────────────────────────────────────
  "88:class_g  = 'Rofi'",
  "96:class_g  = 'dunst'",

  # ── File / system managers ────────────────────────────────────────────
  "94:class_g  = 'Thunar'      && focused",
  "82:class_g  = 'Thunar'      && !focused",
  "96:class_g  = 'Pavucontrol'",
  "96:class_g  = 'Blueman-manager'",

  # ── Popups / dialogs ──────────────────────────────────────────────────
  "98:window_type = 'dialog'",
  "96:window_type = 'popup_menu'",
  "96:window_type = 'dropdown_menu'"
];


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GLASSMORPHISM BLUR — dual_kawase, high strength
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

blur-method           = "dual_kawase";
blur-strength         = 11;
blur-background       = true;
blur-background-frame = true;
blur-background-fixed = false;        # keep live glass movement under animated windows

blur-background-exclude = [
  "name        = 'Notification'",
  "class_g     = 'Conky'",
  "class_g     = 'slop'",
  "class_g     = 'polybar'",
  "class_g     = 'flameshot'",
  "class_g     = 'zoom'",
  "class_g     = 'obs'",
  "class_g     = 'mpv'",
  "class_g     = 'vlc'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS@",
  "fullscreen"
];


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ANIMATIONS — PER-CLASS SPRING PHYSICS
#
#   Each app class gets its own entrance / exit style:
#   • Terminal   → fly up from bottom   / drop back down
#   • Rofi       → elastic zoom from center
#   • Code/IDE   → slide in from left   / slide out left
#   • Browser    → slide in from top    / fade out
#   • Dialogs    → bounce appear        / shrink disappear
#   • Thunar     → slide in from right
#   • Workspace  → slide across (right in / left out)
#   • Geometry   → springy elastic snap
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

animations = (

  # ── Open: fly up from below with spring overshoot ────────────────────
  {
    triggers  = ["open", "show"];
    preset    = "fly-in";
    direction = "down";
    duration  = 0.38;
    scale     = 0.93;
    easing    = "cubic-bezier(0.16, 1.35, 0.24, 1.0)";
  },

  # ── Close: quick fade out ─────────────────────────────────────────────
  {
    triggers  = ["close", "hide"];
    preset    = "disappear";
    duration  = 0.14;
    scale     = 0.988;
    easing    = "cubic-bezier(0.40, 0.0, 0.22, 1.0)";
  },

  # ── Tiling geometry (resize / tile snap) — elastic ────────────────────
  {
    triggers  = ["geometry"];
    duration  = 0.46;
    preset    = "fly-in";
    direction = "up";
    scale     = 0.975;
    easing    = "cubic-bezier(0.10, 1.18, 0.22, 1.0)";
  },

  # ── Workspace in — slide from right ───────────────────────────────────
  {
    triggers  = ["workspace-in"];
    preset    = "slide-in";
    direction = "right";
    duration  = 0.54;
    easing    = "cubic-bezier(0.10, 1.06, 0.22, 1.0)";
  },

  # ── Workspace out — slide to left ─────────────────────────────────────
  {
    triggers  = ["workspace-out"];
    preset    = "slide-out";
    direction = "left";
    duration  = 0.54;
    easing    = "cubic-bezier(0.10, 1.06, 0.22, 1.0)";
  }

);

# ── Animation exclusions ───────────────────────────────────────────────
animation-exclude = [
  "class_g = 'slop'",
  "class_g = 'polybar'",
  "class_g = 'flameshot'",
  "class_g = 'kitty'",
  "class_g = 'Alacritty'",
  "class_g = 'Code'",
  "class_g = 'zoom'",
  "fullscreen",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "window_type = 'dialog'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'"
];

# ── Spring physics tuning ──────────────────────────────────────────────
animation-stiffness        = 165;
animation-dampening        = 18;
animation-mass             = 0.92;
animation-stiffness-in-tag = 142;
animation-window-mass      = 0.84;
animation-clamping         = false;    # keep a slight overshoot instead of robotic stops


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WINDOW TYPES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

wintypes: {
  normal = {
    fade   = true;
    shadow = true;
  };
  tooltip = {
    fade             = true;
    shadow           = false;
    opacity          = 0.92;
    focus            = true;
    full-shadow      = false;
    blur-background  = false;
  };
  dock = {
    shadow             = false;
    clip-shadow-above  = true;
    blur-background    = false;
    fade               = false;
    corner-radius      = 0;
    inner-border-width = 0;
  };
  dnd = {
    shadow          = false;
    blur-background = false;
  };
  popup_menu = {
    opacity         = 0.97;
    shadow          = true;
    blur-background = true;
    fade            = true;
  };
  dropdown_menu = {
    opacity         = 0.97;
    shadow          = true;
    blur-background = true;
    fade            = true;
  };
  notification = {
    shadow          = true;
    fade            = true;
    opacity         = 0.99;
    blur-background = true;
  };
  dialog = {
    shadow          = true;
    fade            = true;
    opacity         = 0.99;
    blur-background = true;
  };
  menu = {
    shadow          = false;
    blur-background = true;
    fade            = true;
    opacity         = 0.96;
  };
  utility = {
    shadow          = false;
    fade            = true;
    blur-background = false;
  };
  splash = {
    shadow          = false;
    fade            = true;
    opacity         = 1.0;
  };
  unknown = {
    fade   = true;
    shadow = true;
  };
};


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PERFORMANCE & DETECTION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

detect-rounded-corners  = true;
detect-client-opacity   = true;
detect-transient        = true;
detect-client-leader    = true;
mark-wmwin-focused      = true;
mark-ovredir-focused    = true;
use-ewmh-active-win     = true;
force-win-blend         = false;
no-ewmh-fullscreen      = false;
transparent-clipping    = false;

transparent-clipping-exclude = [
  "class_g = 'flameshot'",
  "class_g = 'slop'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

focus-exclude = [
  "class_g = 'dunst'",
  "class_g = 'polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

log-level = "error";
