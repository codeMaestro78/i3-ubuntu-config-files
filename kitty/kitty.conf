# ╔══════════════════════════════════════════════════════════════════╗
# ║   KITTY  ·  CYBERPUNK NEON  ·  CLEAN EDITION                    ║
# ║   No duplicate keys · No rendering conflicts · Zero lag          ║
# ╚══════════════════════════════════════════════════════════════════╝


# ─────────────────────────────────────────────────────────────────
# 01  FONT  (single declaration — no duplicate font_family)
# ─────────────────────────────────────────────────────────────────

font_family                  JetBrainsMono Nerd Font
bold_font                    JetBrainsMono Nerd Font Bold
italic_font                  JetBrainsMono Nerd Font Italic
bold_italic_font             JetBrainsMono Nerd Font Bold Italic

font_size                    13.5

# Symbol fallback for Nerd Font icons / Powerline / box-drawing
symbol_map U+E000-U+F8FF     JetBrainsMono Nerd Font Mono
symbol_map U+23FB-U+23FE     JetBrainsMono Nerd Font Mono
symbol_map U+2B58            JetBrainsMono Nerd Font Mono
symbol_map U+F0000-U+FFFFF   JetBrainsMono Nerd Font Mono

# Ligatures — disable only at cursor so you can edit without flicker
disable_ligatures            cursor

# Cell sizing — ONLY cell_height, nothing else fighting it
modify_font cell_height      110%
modify_font underline_position  4
modify_font underline_thickness 1.2

# Rendering strategy removed — older kitty versions on Linux
# do not support this key. Safe to omit; kitty picks the best default.


# ─────────────────────────────────────────────────────────────────
# 02  CURSOR
# ─────────────────────────────────────────────────────────────────

cursor_shape                 beam
cursor_beam_thickness        1.8
cursor                       #00f5ff
cursor_text_color            #0a0e14
cursor_blink_interval        0.5
cursor_stop_blinking_after   15.0


# ─────────────────────────────────────────────────────────────────
# 03  SCROLLBACK
# ─────────────────────────────────────────────────────────────────

scrollback_lines             10000
scrollback_pager             less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_fill_enlarged_window no
wheel_scroll_multiplier      5.0
wheel_scroll_min_lines       1
touch_scroll_multiplier      1.0


# ─────────────────────────────────────────────────────────────────
# 04  MOUSE
# ─────────────────────────────────────────────────────────────────

mouse_hide_wait              2.0
url_color                    #00f5ff
url_style                    curly
detect_urls                  yes
show_hyperlink_targets       yes
copy_on_select               no
paste_actions                quote-urls-at-prompt,confirm
click_interval               0.5
select_by_word_characters    @-./_~?&=%+#
pointer_shape_when_grabbed   arrow
default_pointer_shape        beam
pointer_shape_when_dragging  beam


# ─────────────────────────────────────────────────────────────────
# 05  WINDOW
# ─────────────────────────────────────────────────────────────────

window_padding_width         12 16
active_border_color          #00f5ff
inactive_border_color        #1a2233
bell_border_color            #ff2b6d
hide_window_decorations      yes
remember_window_size         yes
initial_window_width         1200
initial_window_height        750
window_resize_step_cells     2
window_resize_step_lines     2
resize_debounce_time         0.1
focus_follows_mouse          no

allow_remote_control         yes
listen_on                    unix:/tmp/kitty


# ─────────────────────────────────────────────────────────────────
# 06  TAB BAR
# ─────────────────────────────────────────────────────────────────

tab_bar_style                powerline
tab_powerline_style          slanted
tab_bar_edge                 bottom
tab_bar_margin_width         0.0
tab_bar_margin_height        0.0 0.0
tab_bar_min_tabs             1
tab_bar_align                left
active_tab_font_style        bold
inactive_tab_font_style      normal

tab_title_template           " {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title} "
active_tab_title_template    " {fmt.fg.cyan}⬡ {index}: {title} "

active_tab_foreground        #00f5ff
active_tab_background        #0d1b2a
inactive_tab_foreground      #4a5568
inactive_tab_background      #070d14
tab_bar_background           #070d14


# ─────────────────────────────────────────────────────────────────
# 07  COLORS  — Cyberpunk neon palette
# ─────────────────────────────────────────────────────────────────

foreground                   #c0caf5
background                   #0a0e14
selection_foreground         #0a0e14
selection_background         #7c3aed

# Normal
color0    #0a0e14
color1    #ff2b6d
color2    #00ff9f
color3    #f0a500
color4    #0096ff
color5    #bd34fe
color6    #00f5ff
color7    #a9b1d6

# Bright
color8    #1e2d3d
color9    #ff4d8b
color10   #39ffa8
color11   #ffc750
color12   #38bdf8
color13   #d580ff
color14   #67e8f9
color15   #e0e7ff

# Marks
mark1_foreground  #0a0e14
mark1_background  #00f5ff
mark2_foreground  #0a0e14
mark2_background  #ff2b6d
mark3_foreground  #0a0e14
mark3_background  #f0a500


# ─────────────────────────────────────────────────────────────────
# 08  BACKGROUND IMAGE + OPACITY  (X11 optimised — no blur)
#
#  HOW IT WORKS:
#   kitty renders your PNG/JPG behind the terminal text.
#   background_tint darkens it so text stays readable.
#   The companion script  ~/.config/kitty/bg-cycle.sh
#   animates between multiple wallpapers via kitty @ remote control.
#
#  STEP 1 — point this at your wallpaper:
#    background_image   /home/YOU/Pictures/cyberpunk.png
#
#  STEP 2 — for animated cycling, run:
#    bash ~/.config/kitty/bg-cycle.sh &
#
#  STEP 3 — to stop cycling, kill the background job:
#    pkill -f bg-cycle.sh
# ─────────────────────────────────────────────────────────────────

# ← CHANGE THIS PATH to your actual wallpaper file
background_image             /home/$USER/Pictures/uwp4969932.png

# Layout: scaled = fills window | centered | tiled | mirror-tiled
background_image_layout      scaled

# Tint: 0.0 = pure image only  |  1.0 = pure background color
# 0.82 keeps neon colors vivid while text stays crisp
background_tint              0.82

# Overall window transparency (X11 needs a compositor like picom)
background_opacity           0.92

# Keep image sharp when window is resized
background_image_linear      no


# ─────────────────────────────────────────────────────────────────
# 09  BELL
# ─────────────────────────────────────────────────────────────────

enable_audio_bell            no
visual_bell_duration         0.12
visual_bell_color            #ff2b6d
window_alert_on_bell         yes
bell_on_tab                  "🔔 "


# ─────────────────────────────────────────────────────────────────
# 10  PERFORMANCE
# ─────────────────────────────────────────────────────────────────

repaint_delay                8
input_delay                  2
sync_to_monitor              yes


# ─────────────────────────────────────────────────────────────────
# 11  OS / ADVANCED
# ─────────────────────────────────────────────────────────────────

shell_integration            enabled
term                         xterm-kitty
clipboard_control            write-clipboard write-primary read-clipboard-ask read-primary-ask
linux_display_server         auto
enabled_layouts              splits,stack,tall,fat,grid,horizontal,vertical

# macOS-only keys removed — causes warnings on Linux/GNOME
# Uncomment these only if running kitty on macOS:
# macos_option_as_alt          both
# macos_quit_when_last_window_closed no
# macos_window_resizable       yes
# macos_show_window_title_in   all


# ─────────────────────────────────────────────────────────────────
# 12  URL
# ─────────────────────────────────────────────────────────────────

open_url_with                default
url_prefixes                 file ftp ftps git http https irc ircs kitty mailto news sftp ssh


# ═════════════════════════════════════════════════════════════════
# 13  KEYBOARD SHORTCUTS — all conflicts resolved
# ═════════════════════════════════════════════════════════════════

# ── Clipboard ──────────────────────────────────────────────────
map ctrl+shift+c             copy_to_clipboard
map ctrl+shift+v             paste_from_clipboard
map shift+insert             paste_from_selection

# ── Scrollback ─────────────────────────────────────────────────
map ctrl+shift+page_up       scroll_page_up
map ctrl+shift+page_down     scroll_page_down
map ctrl+shift+home          scroll_home
map ctrl+shift+end           scroll_end
map ctrl+shift+z             scroll_to_prompt -1
map ctrl+shift+x             scroll_to_prompt 1
map ctrl+shift+h             show_scrollback
map ctrl+shift+g             show_last_command_output

# ── Pane navigation (alt+hjkl — zero conflicts) ────────────────
map ctrl+shift+enter         new_window_with_cwd
map ctrl+alt+enter           new_window
map ctrl+shift+w             close_window
map ctrl+shift+r             start_resizing_window

map alt+h                    neighboring_window left
map alt+l                    neighboring_window right
map alt+k                    neighboring_window up
map alt+j                    neighboring_window down

map ctrl+alt+1               first_window
map ctrl+alt+2               second_window
map ctrl+alt+3               third_window
map ctrl+alt+4               fourth_window
map ctrl+alt+5               fifth_window
map ctrl+alt+6               sixth_window
map ctrl+alt+7               seventh_window
map ctrl+alt+8               eighth_window
map ctrl+alt+9               ninth_window

# ── Splits ─────────────────────────────────────────────────────
map ctrl+alt+\               launch --location=vsplit --cwd=current
map ctrl+alt+-               launch --location=hsplit --cwd=current

# ── Layouts ────────────────────────────────────────────────────
map ctrl+shift+space         next_layout
map ctrl+shift+p             last_used_layout

# ── Tabs ───────────────────────────────────────────────────────
map ctrl+shift+t             new_tab_with_cwd
map ctrl+shift+q             close_tab
map ctrl+tab                 next_tab
map ctrl+shift+tab           previous_tab
ctrl+alt+t               set_tab_title
map ctrl+shift+.             move_tab_forward
map ctrl+shift+,             move_tab_backward

map ctrl+1                   goto_tab 1
map ctrl+2                   goto_tab 2
map ctrl+3                   goto_tab 3
map ctrl+4                   goto_tab 4
map ctrl+5                   goto_tab 5
map ctrl+6                   goto_tab 6
map ctrl+7                   goto_tab 7
map ctrl+8                   goto_tab 8
map ctrl+9                   goto_tab 9

# ── Font size ──────────────────────────────────────────────────
map ctrl+equal               change_font_size all +1.0
map ctrl+minus               change_font_size all -1.0
map ctrl+0                   change_font_size all 0

# ── Live opacity ───────────────────────────────────────────────
map ctrl+shift+a>m           set_background_opacity +0.05
map ctrl+shift+a>l           set_background_opacity -0.05
map ctrl+shift+a>1           set_background_opacity 1.0
map ctrl+shift+a>d           set_background_opacity default

# ── Wallpaper cycler (start/stop animated background) ─────────
# Start:  launches bg-cycle.sh in background
map ctrl+shift+b             launch --type=background bash ~/.config/kitty/bg-cycle.sh
# Stop:   kills the cycler
map ctrl+shift+alt+b         launch --type=background pkill -f bg-cycle.sh

# ── Config reload ──────────────────────────────────────────────
map ctrl+shift+f2            edit_config_file
map ctrl+shift+f5            load_config_file
map ctrl+shift+f6            debug_config
map ctrl+shift+escape        kitty_shell window
map ctrl+shift+delete        clear_terminal reset active
map ctrl+shift+alt+l         disable_ligatures_in active toggle


# ─────────────────────────────────────────────────────────────────
# 14  MARKS & HINTS
# ─────────────────────────────────────────────────────────────────

map ctrl+shift+f             create_marker
map ctrl+shift+alt+f         remove_all_marks
map ctrl+shift+m             scroll_to_mark prev
map ctrl+shift+alt+m         scroll_to_mark next

map ctrl+shift+e             open_url_with_hints
map ctrl+shift+p>f           kitten hints --type path --program @
map ctrl+shift+p>h           kitten hints --type hash --program @
map ctrl+shift+p>l           kitten hints --type line --program @
map ctrl+shift+p>w           kitten hints --type word --program @
map ctrl+shift+u             kitten unicode_input


# ─────────────────────────────────────────────────────────────────
# 15  KITTENS
# ─────────────────────────────────────────────────────────────────

kitten_alias diff            kitten diff
map ctrl+shift+d             kitten diff
kitten_alias s               kitten ssh

term xterm-256color
# ═════════════════════════════════════════════════════════════════
# END OF CONFIG
# ═════════════════════════════════════════════════════════════════
